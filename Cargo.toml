[package]
name = "rumen"
version = "0.1.0"
edition = "2021"
include = ["src/**/*.rs", "tests/**/*", "LICENSES/*", "Cargo.toml", "Cargo.lock", "pyproject.toml", "rumen.pyi"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]

[dependencies]
pyo3 = { version = "0.30.1", optional = true, features = ["abi3-py39"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
